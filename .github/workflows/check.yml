name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install PostgreSQL 17 tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun x playwright install --with-deps chromium
      - run: bun run smoke:dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-smoke
          path: .scratch/dashboard-smoke-evidence/
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Locate PostgreSQL tools
        shell: pwsh
        run: |
          $bin = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'bin' } | Where-Object { Test-Path (Join-Path $_ 'initdb.exe') } | Select-Object -First 1
          if (-not $bin) { throw 'PostgreSQL tools missing' }
          $bin >> $env:GITHUB_PATH
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-postgres.ts evidence omp schema agent-tools database-maintenance
